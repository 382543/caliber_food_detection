services:
  # Integrated Full-Stack Application (Backend + Frontend)
  - type: web
    name: caliber-chatbot-fullstack
    runtime: python
    buildCommand: |
      pip install --upgrade pip setuptools wheel &&
      pip install --no-cache-dir -r backend/requirements.txt &&
      cd frontend && npm install && npm run build && cd ..
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: NODE_VERSION
        value: 20.10.0
      - key: GEMINI_API_KEY
        sync: false
      - key: RENDER
        value: "true"
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    region: oregon
